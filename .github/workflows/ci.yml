name: PATLAS local CI definition

# Authored locally for the approved M001 scope.
# This workflow is not executed or pushed by the OpenCode executor.

on:
  push:
    branches: ["engineering/m001-foundation", "main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    name: Node — lint, types, non-Python tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit, registry, search, content and boundary tests (no Python required)
        run: npm run test:unit:node
      - name: Production build
        run: npm run build

  python:
    name: Python — isolated reference and parity tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements.txt
      - name: Install pinned Node.js dependencies
        run: npm ci
      - name: Create isolated environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r python/requirements.txt
      - name: Python reference tests
        run: .venv/bin/python -m pytest python/tests -q
      - name: TypeScript/SciPy parity and Python export execution
        run: npm run test:unit:science

  browser:
    name: Browser — production server routes, search, laboratory, accessibility
    runs-on: ubuntu-latest
    needs: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build production server
        run: npm run build
      - name: Playwright suite
        run: npx playwright test
